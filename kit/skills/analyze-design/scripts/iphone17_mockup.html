<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPhone 17 Mockup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    }

    /* ── Outer shell ── */
    .iphone {
      position: relative;
      width: 393px;
      height: 852px;
      background: #1c1c1e;
      border-radius: 54px;
      box-shadow:
        0 0 0 1.5px #3a3a3c,
        0 0 0 3px #2c2c2e,
        0 0 0 4px #4a4a4c,
        0 40px 80px rgba(0,0,0,0.6),
        0 10px 30px rgba(0,0,0,0.4);
    }

    /* ── Screen bezel ── */
    .screen-bezel {
      position: absolute;
      inset: 10px;
      border-radius: 46px;
      overflow: hidden;
      background: #000;
    }

    /* ── Screen content ── */
    .screen {
      width: 100%;
      height: 100%;
      background: #fff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* ── Empty content area ── */
    .content {
      flex: 1;
    }

    /* ── Home indicator ── */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: rgba(28,28,30,0.3);
      border-radius: 100px;
    }

    /* ── Physical buttons ── */
    .btn-side-lock {
      position: absolute;
      right: -3.5px;
      top: 160px;
      width: 3.5px;
      height: 90px;
      background: #3a3a3c;
      border-radius: 0 3px 3px 0;
    }

    .btn-volume-up {
      position: absolute;
      left: -3.5px;
      top: 130px;
      width: 3.5px;
      height: 50px;
      background: #3a3a3c;
      border-radius: 3px 0 0 3px;
    }

    .btn-volume-down {
      position: absolute;
      left: -3.5px;
      top: 192px;
      width: 3.5px;
      height: 50px;
      background: #3a3a3c;
      border-radius: 3px 0 0 3px;
    }

    .btn-silent {
      position: absolute;
      left: -3.5px;
      top: 80px;
      width: 3.5px;
      height: 36px;
      background: #3a3a3c;
      border-radius: 3px 0 0 3px;
    }

    /* ── Clock JS update ── */


    /* ── Your code css start from here ── */
    /* Example: */


  </style>
</head>
<body>

  <div class="iphone">
    <!-- Physical buttons -->
    <div class="btn-silent"></div>
    <div class="btn-volume-up"></div>
    <div class="btn-volume-down"></div>
    <div class="btn-side-lock"></div>

    <div class="screen-bezel">
      <div class="screen">

      <!-- Your code start in Content   -->
        <div class="content">


        </div>
        <!-- Do not modify anything else ecept content area ,and css above -->
        <!-- Home Indicator -->
        <div class="home-indicator"></div>

      </div>
    </div>
  </div>

</body>
</html>
